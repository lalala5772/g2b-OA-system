server:
  port: 8080

spring:
  application:
    name: g2b-oa-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:g2b_oa}
    username: ${DB_USERNAME:g2b_oa}
    password: ${DB_PASSWORD:g2b_oa}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid,profile,email

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-please-override-CHANGE-ME-32bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  file-storage:
    base-dir: ${FILE_STORAGE_BASE_DIR:./data/company-files}
  bid:
    scan-cron: ${BID_SCAN_CRON:0 0 10 * * *}
    keywords-seed: ${BID_KEYWORDS_SEED:}
    eligibility-threshold: ${BID_ELIGIBILITY_THRESHOLD:0.6}

ai-engine:
  base-url: ${AI_ENGINE_BASE_URL:http://127.0.0.1:8000}
  api-key: ${AI_ENGINE_API_KEY:not-configured}
  timeout-seconds: ${AI_ENGINE_TIMEOUT_SECONDS:30}
  long-timeout-seconds: ${AI_ENGINE_LONG_TIMEOUT_SECONDS:120}

logging:
  level:
    com.allforland.automation: INFO
