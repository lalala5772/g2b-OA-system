name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build backend jar
        working-directory: backend
        run: ./gradlew bootJar --no-daemon

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          VITE_API_BASE_URL= npm run build

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload backend jar
        run: |
          JAR=$(ls backend/build/libs/*.jar | grep -v plain)
          scp -i ~/.ssh/deploy_key "$JAR" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/backend/app.jar.new"

      - name: Upload ai-engine source
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            ai-engine/app/ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/ai-engine/app/"
          scp -i ~/.ssh/deploy_key ai-engine/requirements.txt \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/ai-engine/requirements.txt.new"

      - name: Upload frontend build
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "rm -rf /home/ubuntu/frontend-dist-new && mkdir -p /home/ubuntu/frontend-dist-new"
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/frontend-dist-new/"

      - name: Apply on server
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            set -e
            mv /home/ubuntu/app/backend/app.jar.new /home/ubuntu/app/backend/app.jar

            if ! cmp -s /home/ubuntu/app/ai-engine/requirements.txt /home/ubuntu/app/ai-engine/requirements.txt.new; then
              mv /home/ubuntu/app/ai-engine/requirements.txt.new /home/ubuntu/app/ai-engine/requirements.txt
              /home/ubuntu/app/ai-engine/.venv/bin/pip install -q -r /home/ubuntu/app/ai-engine/requirements.txt
            else
              rm -f /home/ubuntu/app/ai-engine/requirements.txt.new
            fi

            sudo rsync -a --delete /home/ubuntu/frontend-dist-new/ /var/www/g2b-frontend/
            sudo chown -R www-data:www-data /var/www/g2b-frontend
            rm -rf /home/ubuntu/frontend-dist-new

            sudo systemctl restart g2b-backend g2b-ai-engine
            sudo systemctl reload nginx
          '

      - name: Health check
        run: |
          sleep 10
          # /api/bids/keywords requires auth — 401 here means the backend is up and routing correctly.
          curl -s -o /dev/null -w "backend: %{http_code}\n" "http://${{ secrets.EC2_HOST }}/api/bids/keywords"
          curl -sf -o /dev/null -w "frontend: %{http_code}\n" "http://${{ secrets.EC2_HOST }}/"
